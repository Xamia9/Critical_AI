<style>

/* ================= ROOT COLOR SYSTEM ================= */

height: 264vh;

<style>
body.light-mode {

}

body.light-mode .glass {

}

  box-shadow:
    0 0 20px rgba(74,91,255,0.15),
    0 0 40px rgba(197,44,90,0.08);
}
/* ================= THEME BUTTON ================= */
.theme-toggle-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--primary-gradient);
  color: white;
  font-size: 18px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  transition: 0.3s ease;
  z-index: 9999;
}

.theme-toggle-btn:hover {
  transform: scale(1.1);
}
</style>

<button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>

<script>
function toggleTheme() {
  document.body.classList.toggle("light-mode");
  const btn = document.querySelector(".theme-toggle-btn");

  if (document.body.classList.contains("light-mode")) {
    localStorage.setItem("theme", "light");
    btn.textContent = "☀";
  } else {
    localStorage.setItem("theme", "dark");
    btn.textContent = "🌙";
  }
}

window.onload = function() {
  const savedTheme = localStorage.getItem("theme");
  const btn = document.querySelector(".theme-toggle-btn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");
    btn.textContent = "☀";
  }
};
</script>
<script>

async function loadHistory() {
  try {
    const token = localStorage.getItem("token");

const res = await fetch("/api/history", {
  headers: {
    "Authorization": "Bearer " + token
  }
});
    const debates = await res.json();

    const listEl = document.getElementById("historyList");
    listEl.innerHTML = "";

 debates.forEach((debate, index) => {

  const item = document.createElement("div");
  item.className = "history-item glass";

item.innerHTML = `
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
<div style="flex:1; min-width:0;">
  <div class="history-title">
    ${debate.title || "Không có tiêu đề"}
  </div>
  <small>
    ${new Date(debate.createdAt).toLocaleString()}
  </small>
</div>
    <button 
      onclick="deleteDebate(event,'${debate._id}')"
      style="
        background:none;
        border:none;
        color:#F87171;
        font-size:15px;
        cursor:pointer;
        flex-shrink:0;
      "
    >
      🗑
    </button>
  </div>
`;

  item.onclick = () => showDebate(debate, item);

  if (index === 0) {
    item.classList.add("active");
    showDebate(debate, item);
  }

  listEl.appendChild(item);
});

  } catch (err) {
    console.error("Load history failed", err);
  }
}

function showDebate(debate, element) {

document.getElementById("mainTitle").innerText =
  debate.title || "Lịch sử & Đánh giá";

  document.querySelectorAll(".history-item")
    .forEach(el => el.classList.remove("active"));
  element.classList.add("active");

  const isCompleted = !!debate.scores;

  const decisionText =
    typeof debate.decision === "object"
      ? debate.decision?.updatedViewpoint || ""
      : debate.decision || "";

document.getElementById("summaryCard").innerHTML = `
  <div class="summary-block">
    <div class="label">Vấn đề:</div>
    <div class="issue-text">${debate.issue || ""}</div>
  </div>

  <div class="summary-block">
    <div class="label">Trạng thái:</div>
    <div>
      ${
        isCompleted
          ? '<span class="status done">Đã hoàn thành</span>'
          : '<span class="status doing">Chưa hoàn thành</span>'
      }
    </div>
  </div>

  ${
    decisionText
      ? `
      <div class="summary-block">
        <div class="label">Quyết định cuối:</div>
        <div>${decisionText}</div>
      </div>
      `
      : ""
  }

  <div class="btn-wrapper">
    <button onclick="resumeDebate('${debate._id}')">
      ${isCompleted ? "Xem lại" : "Tiếp tục tranh luận"}
    </button>
  </div>
`;

generateFinalMindmap(
  { finalDecision: debate.title },
  debate.mindmaps || {},
  debate.roles || {}
);

  renderScores(debate);
}



function resumeDebate(debateId) {
  localStorage.setItem("currentDebateId", debateId);

  const token = localStorage.getItem("token");

  fetch("/debate-status", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ debateId })
  })
  .then(res => res.json())
  .then(status => {

    if (!status.hasRoles) {
      return window.location.href = "Overview.html";
    }

    if (!status.allCompleted) {
      return window.location.href = "Roles.html";
    }

    if (!status.hasDecision) {
      return window.location.href = "Decision.html";
    }

    if (!status.hasScores) {
      return window.location.href = "SimulationScoring.html";
    }

    // ✅ ĐÃ HOÀN THÀNH → quay lại trang cuối bạn có
    return window.location.href = "SimulationScoring.html"; 
  })
  .catch(() => {
    window.location.href = "Overview.html";
  });
}

async function deleteDebate(event, debateId) {

  event.stopPropagation();

  const confirmDelete = confirm("Bạn có chắc muốn xóa cuộc tranh luận này?");
  if (!confirmDelete) return;

  const token = localStorage.getItem("token");

  try {
    await fetch(`/api/history/${debateId}`, {
      method: "DELETE",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    loadHistory(); // reload lại danh sách

  } catch (err) {
    alert("Không thể xóa.");
    console.error(err);
  }
}
function renderScores(debate){

  const scorePanel = document.getElementById("scorePanel");
  scorePanel.innerHTML = "";

  if (!debate.scores) return;

  const score = debate.scores?.score || {};

  const {
    clarity = 0,
    accuracy = 0,
    precision = 0,
    relevance = 0,
    depth = 0,
    breadth = 0,
    logic = 0,
    significance = 0,
    fairness = 0
  } = score;

const total = debate.scores?.totalScore || 0;

  scorePanel.innerHTML = `
    <div class="score-summary-box">

<div class="score-total">
  Tổng điểm: ${total} / 90
</div>

<div class="score-help" onclick="goToCriteria()">
  Nếu bạn có thắc mắc về tiêu chí chấm điểm, 
  hãy tham khảo thêm ở phần Tìm hiểu thêm trong trang Giới thiệu nhé.
</div>

      <div class="score-grid">

${createScoreBox("Tính rõ ràng", clarity)}
${createScoreBox("Tính chính xác", accuracy)}
${createScoreBox("Tính cụ thể", precision)}
${createScoreBox("Tính liên quan", relevance)}
${createScoreBox("Độ sâu phân tích", depth)}
${createScoreBox("Độ bao quát", breadth)}
${createScoreBox("Tính logic", logic)}
${createScoreBox("Mức độ quan trọng", significance)}
${createScoreBox("Tính công bằng", fairness)}
      </div>

      <div class="summary-feedback" style="margin-top:30px;">
        <strong>Ưu điểm:</strong><br>
        ${(debate.strengths || []).join("<br>") || "—"}

        <br><br>

        <strong>Hạn chế:</strong><br>
        ${(debate.weaknesses || []).join("<br>") || "—"}
      </div>

    </div>
  `;
}

function createScoreBox(title, value){
  return `
    <div class="score-box glass">
      <div>${title}</div>
      <div class="score-value">${value}</div>
      <div class="score-desc">/10 điểm</div>
    </div>
  `;
}

function generateFinalMindmap(decision, mindmaps, rolesData = {}) {

const container = document.getElementById("finalMindmap");
const oldBtn = container.querySelector(".export-btn");
container.innerHTML = "";
if (oldBtn) container.appendChild(oldBtn);

// ===== VIEWPORT =====
const viewport = document.createElement("div");
viewport.className = "mindmap-viewport";
container.appendChild(viewport);

const width = 2000;
const height = 1400;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("width", width);
svg.setAttribute("height", height);
svg.classList.add("mindmap-svg");
viewport.appendChild(svg);

// Store all edges to draw after layout is calculated
const edgesToDraw = [];

// ===== TREE LAYOUT WITH PROPER BRANCH SEPARATION =====
const rootX = width / 2;
const rootY = height / 2;

// Create root node
createNode(decision.finalDecision || "CHỦ ĐỀ", rootX, rootY, 0);

const roles = Object.keys(mindmaps);

// Calculate max depth
function getMaxDepth(children, depth = 1) {
  let max = depth;
  children.forEach(c => {
    if (c.children && c.children.length > 0) {
      max = Math.max(max, getMaxDepth(c.children, depth + 1));
    }
  });
  return max;
}

let maxDepth = 1;
roles.forEach(role => {
  const children = mindmaps[role]?.children || [];
  maxDepth = Math.max(maxDepth, getMaxDepth(children));
});
maxDepth = Math.min(maxDepth, 5);

// ===== SEPARATE BRANCHES INTO LEFT/RIGHT GROUPS =====
const leftBranches = [];
const rightBranches = [];

roles.forEach((role, index) => {
  if (index % 2 === 0) {
    rightBranches.push(role);
  } else {
    leftBranches.push(role);
  }
});

// Calculate spacing parameters
const levelDistance = 320; // Horizontal distance between levels
const siblingDistance = 100; // Minimum vertical distance between siblings
const branchGap = 180; // Extra gap between different branches

// ===== RENDER RIGHT BRANCHES =====
let rightOffset = 0;
rightBranches.forEach((role, branchIndex) => {
  const branchStartX = rootX + levelDistance + (branchIndex * branchGap);
  renderBranch(role, branchStartX, 1, branchIndex, rightBranches.length);
});

// ===== RENDER LEFT BRANCHES =====
leftBranches.forEach((role, branchIndex) => {
  const branchStartX = rootX - levelDistance - (branchIndex * branchGap);
  renderBranch(role, branchStartX, -1, branchIndex, leftBranches.length);
});

// ===== BRANCH RENDERER =====
function renderBranch(role, startX, direction, branchIndex, totalBranches) {
  const roleLabel = rolesData[role]?.ten || mindmaps[role]?.name || role;
  const roleY = rootY;
  
  createNode(roleLabel, startX, roleY, 1);
  edgesToDraw.push({ x1: rootX, y1: rootY, x2: startX, y2: roleY, level: 1 });

  const children = mindmaps[role]?.children || [];
  if (children.length > 0) {
    renderChildNodes(children, startX, roleY, direction, 2, role);
  }
}

// ===== CHILD NODES WITH PROPER TREE LAYOUT =====
function renderChildNodes(children, parentX, parentY, direction, level, parentRole) {
  if (!children || level > 5) return;

  // Create temp nodes to measure heights
  const tempNodes = children.map((child, idx) => {
    const temp = createNode(child.text, -9999, -9999, level);
    return { 
      child, 
      element: temp, 
      height: temp.offsetHeight,
      width: temp.offsetWidth,
      index: idx 
    };
  });

  // Calculate total height needed for all nodes
  const totalNodesHeight = tempNodes.reduce((sum, n) => sum + n.height, 0);
  const totalGaps = Math.max(0, (children.length - 1) * siblingDistance);
  const totalHeight = totalNodesHeight + totalGaps;

  // Position children vertically centered around parent
  let currentY = parentY - totalHeight / 2;

  // Horizontal position with level-based multiplier for more spread
  const levelMultiplier = 1 + (level - 2) * 0.25;
  const childX = parentX + (direction * levelDistance * levelMultiplier);

  tempNodes.forEach(({ child, element, height: nodeHeight, width: nodeWidth, index }) => {
    // Add branch-specific offset to prevent overlapping with other branches
    const branchOffset = direction * (level - 2) * 40;
    const finalX = childX + branchOffset;
    
    const y = currentY + nodeHeight / 2;

    element.style.left = finalX + "px";
    element.style.top = y + "px";

    // Store edge for later rendering
    edgesToDraw.push({ x1: parentX, y1: parentY, x2: finalX, y2: y, level: level });

    currentY += nodeHeight + siblingDistance;

    // Render grandchildren
    if (child.children && child.children.length > 0) {
      renderChildNodes(child.children, finalX, y, direction, level + 1, parentRole);
    }
  });
}

// ===== NODE CREATION =====
function createNode(text, x, y, level) {
  const node = document.createElement("div");
  node.className = "mindmap-node level-" + level;
  node.innerText = text;
  node.style.left = x + "px";
  node.style.top = y + "px";
  node.style.transform = "translate(-50%, -50%)";
  viewport.appendChild(node);
  return node;
}

// ===== DRAW ALL EDGES AFTER LAYOUT =====
function drawAllEdges() {
  edgesToDraw.forEach(edge => {
    drawLine(edge.x1, edge.y1, edge.x2, edge.y2, edge.level);
  });
}

// Call drawAllEdges after all nodes are positioned
drawAllEdges();

// ===== EDGE RENDERING =====
function drawLine(x1, y1, x2, y2, level = 1) {
  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

  // More aggressive line shortening for cleaner look
  let shortenStart, shortenEnd;
  if (level === 1) {
    shortenStart = 40;
    shortenEnd = 45;
  } else if (level === 2) {
    shortenStart = 30;
    shortenEnd = 35;
  } else {
    shortenStart = 20;
    shortenEnd = 25;
  }

  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.sqrt(dx * dx + dy * dy);
  if (!length) return;

  const unitX = dx / length;
  const unitY = dy / length;

  const newX1 = x1 + unitX * shortenStart;
  const newY1 = y1 + unitY * shortenStart;
  const newX2 = x2 - unitX * shortenEnd;
  const newY2 = y2 - unitY * shortenEnd;

  line.setAttribute("x1", newX1);
  line.setAttribute("y1", newY1);
  line.setAttribute("x2", newX2);
  line.setAttribute("y2", newY2);

  line.classList.add("mindmap-line");
  line.setAttribute("stroke-width", "1.4");
  line.setAttribute("stroke-linecap", "round");

  svg.appendChild(line);
}

// ===== ZOOM + DRAG (MATCHING SimulationScoring) =====
let scale = 1;
let isDragging = false;
let startX, startY;

// Center initially
let translateX = (container.clientWidth - width) / 2;
let translateY = (container.clientHeight - height) / 2;

updateTransform();

// ===== ZOOM (wheel) - Simple center-based like SimulationScoring =====
container.addEventListener("wheel", (e) => {
  e.preventDefault();

  const zoomSpeed = 0.1;

  if (e.deltaY < 0) scale += zoomSpeed;
  else scale -= zoomSpeed;

  scale = Math.min(Math.max(0.5, scale), 2.5);

  updateTransform();
});

// ===== DRAG =====
container.addEventListener("mousedown", (e) => {
  isDragging = true;
  container.style.cursor = "grabbing";
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
});

window.addEventListener("mouseup", () => {
  isDragging = false;
  container.style.cursor = "grab";
});

container.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  translateX = e.clientX - startX;
  translateY = e.clientY - startY;

  updateTransform();
});

// ===== DOUBLE CLICK RESET - Center like SimulationScoring =====
container.addEventListener("dblclick", () => {
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
});

function updateTransform() {
  viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}
}

// ===== EXPORT PNG FUNCTION =====
async function exportMindmapImage(event) {
  event.stopPropagation();

  const container = document.getElementById("finalMindmap");
  const exportBtn = container.querySelector(".export-btn");

  // Hide button before capture
  exportBtn.style.display = "none";

  // Add export class for black lines
  container.classList.add("exporting");

  try {
    // Capture entire container
    const canvas = await html2canvas(container, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      logging: false
    });

    // Create download link
    const link = document.createElement("a");
    link.download = "critical-ai-mindmap.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

  } catch (err) {
    alert("Không thể xuất ảnh.");
    console.error(err);
  }

  // Remove export class
  container.classList.remove("exporting");

  // Show button again
  exportBtn.style.display = "block";
}

  window.location.href = "Introduction.html#criteria";
}
