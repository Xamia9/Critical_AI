<button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>

<script>
function toggleTheme() {
  document.body.classList.toggle("light-mode");
  const btn = document.querySelector(".theme-toggle-btn");

  if (document.body.classList.contains("light-mode")) {
    localStorage.setItem("theme", "light");
    btn.textContent = "☀";
  } else {
    localStorage.setItem("theme", "dark");
    btn.textContent = "🌙";
  }
}

window.onload = function() {
  const savedTheme = localStorage.getItem("theme");
  const btn = document.querySelector(".theme-toggle-btn");

  if (savedTheme === "light") {
    document.body.classList.add("light-mode");
    btn.textContent = "☀";
  }
};
</script>
<script>

async function loadHistory() {
  try {
    const token = localStorage.getItem("token");

const res = await fetch("/api/history", {
  headers: {
    "Authorization": "Bearer " + token
  }
});
    const debates = await res.json();

    const listEl = document.getElementById("historyList");
    listEl.innerHTML = "";

 debates.forEach((debate, index) => {

  const item = document.createElement("div");
  item.className = "history-item glass";

item.innerHTML = `
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap: wrap;">
<div style="flex:1; min-width:0;">
  <div class="history-title">
    ${debate.title || "Không có tiêu đề"}
  </div>
  <small>
    ${new Date(debate.createdAt).toLocaleString()}
  </small>
</div>
    <button 
      onclick="deleteDebate(event,'${debate._id}')"
      style="
        background:none;
        border:none;
        color:#F87171;
        font-size:15px;
        cursor:pointer;
        flex-shrink:0;
      "
    >
      🗑
    </button>
  </div>
`;

  item.onclick = () => showDebate(debate, item);

  if (index === 0) {
    item.classList.add("active");
    showDebate(debate, item);
  }

  listEl.appendChild(item);
});

  } catch (err) {
    console.error("Load history failed", err);
  }
}

function showDebate(debate, element) {

document.getElementById("mainTitle").innerText =
  debate.title || "Lịch sử & Đánh giá";

  document.querySelectorAll(".history-item")
    .forEach(el => el.classList.remove("active"));
  element.classList.add("active");

  const isCompleted = !!debate.scores;

  const decisionText =
    typeof debate.decision === "object"
      ? debate.decision?.updatedViewpoint || ""
      : debate.decision || "";

document.getElementById("summaryCard").innerHTML = `
  <div class="summary-block">
    <div class="label">Vấn đề:</div>
    <div class="issue-text">${debate.issue || ""}</div>
  </div>

  <div class="summary-block">
    <div class="label">Trạng thái:</div>
    <div>
      ${
        isCompleted
          ? '<span class="status done">Đã hoàn thành</span>'
          : '<span class="status doing">Chưa hoàn thành</span>'
      }
    </div>
  </div>

  ${
    decisionText
      ? `
      <div class="summary-block">
        <div class="label">Quyết định cuối:</div>
        <div>${decisionText}</div>
      </div>
      `
      : ""
  }

  <div class="btn-wrapper">
    <button onclick="resumeDebate('${debate._id}')">
      ${isCompleted ? "Xem lại" : "Tiếp tục tranh luận"}
    </button>
  </div>
`;

generateFinalMindmap(
  { finalDecision: debate.title },
  debate.mindmaps || {},
  debate.roles || {}
);

  renderScores(debate);
}


function resumeDebate(debateId) {
  localStorage.setItem("currentDebateId", debateId);

  const token = localStorage.getItem("token");

  fetch("/debate-status", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ debateId })
  })
  .then(res => res.json())
  .then(status => {

    if (!status.hasRoles) {
      return window.location.href = "Overview.html";
    }

    if (!status.allCompleted) {
      return window.location.href = "Roles.html";
    }

    if (!status.hasDecision) {
      return window.location.href = "Decision.html";
    }

    if (!status.hasScores) {
      return window.location.href = "SimulationScoring.html";
    }

    return window.location.href = "SimulationScoring.html"; 
  })
  .catch(() => {
    window.location.href = "Overview.html";
  });
}

async function deleteDebate(event, debateId) {

  event.stopPropagation();

  const confirmDelete = await showConfirm("Xác nhận xóa", "Bạn có chắc muốn xóa cuộc tranh luận này?");
  if (!confirmDelete.isConfirmed) return;

  const token = localStorage.getItem("token");

  try {
    await fetch(`/api/history/${debateId}`, {
      method: "DELETE",
      headers: {
        "Authorization": "Bearer " + token
      }
    });

    loadHistory();

  } catch (err) {
    showError("Không thể xóa.");
    console.error(err);
  }
}

function renderScores(debate){

  const scorePanel = document.getElementById("scorePanel");
  scorePanel.innerHTML = "";

  if (!debate.scores) return;

  const score = debate.scores?.score || {};

  const {
    clarity = 0,
    accuracy = 0,
    precision = 0,
    relevance = 0,
    depth = 0,
    breadth = 0,
    logic = 0,
    significance = 0,
    fairness = 0
  } = score;

const total = debate.scores?.totalScore || 0;

  scorePanel.innerHTML = `
    <div class="score-summary-box">

<div class="score-total">
  Tổng điểm: ${total} / 90
</div>

<div class="score-help" onclick="goToCriteria()">
  Nếu bạn có thắc mắc về tiêu chí chấm điểm, 
  hãy tham khảo thêm ở phần Tìm hiểu thêm trong trang Giới thiệu nhé.
</div>

      <div class="score-grid">

${createScoreBox("Tính rõ ràng", clarity)}
${createScoreBox("Tính chính xác", accuracy)}
${createScoreBox("Tính cụ thể", precision)}
${createScoreBox("Tính liên quan", relevance)}
${createScoreBox("Độ sâu phân tích", depth)}
${createScoreBox("Độ bao quát", breadth)}
${createScoreBox("Tính logic", logic)}
${createScoreBox("Mức độ quan trọng", significance)}
${createScoreBox("Tính công bằng", fairness)}
      </div>

      <div class="summary-feedback" style="margin-top:30px;">
        <strong>Ưu điểm:</strong><br>
        ${(debate.strengths || []).join("<br>") || "—"}

        <br><br>

        <strong>Hạn chế:</strong><br>
        ${(debate.weaknesses || []).join("<br>") || "—"}
      </div>

    </div>
  `;
}

function createScoreBox(title, value){
  return `

      <div class="score-desc">/10 điểm</div>

function generateFinalMindmap(decision, mindmaps, rolesData = {}) {

const container = document.getElementById("finalMindmap");
const oldBtn = container.querySelector(".export-btn");
container.innerHTML = "";
if (oldBtn) container.appendChild(oldBtn);


const viewport = document.createElement("div");
viewport.className = "mindmap-viewport";
container.appendChild(viewport);

const width = 2000;
const height = 1400;

const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
svg.setAttribute("width", width);
svg.setAttribute("height", height);
svg.classList.add("mindmap-svg");
viewport.appendChild(svg);

const rootX = width / 2;
const rootY = height / 2;

createNode(decision.finalDecision || "CHỦ ĐỀ", rootX, rootY, 0);

const roles = Object.keys(mindmaps);

function getMaxDepth(children, depth = 1) {
  let max = depth;
  children.forEach(c => {
    if (c.children && c.children.length > 0) {
      max = Math.max(max, getMaxDepth(c.children, depth + 1));
    }
  });
  return max;
}

let maxDepth = 1;

roles.forEach(role => {
  const children = mindmaps[role]?.children || [];
  maxDepth = Math.max(maxDepth, getMaxDepth(children));
});

maxDepth = Math.min(maxDepth, 5);

const maxHorizontal = width * 0.3;
const horizontalSpacing = maxHorizontal / maxDepth;
const nodeCollisionPadding = 20; // 20px minimum gap between node borders

const left = [];
const right = [];

roles.forEach((r, i) => {
  if (i % 2 === 0) right.push(r);
  else left.push(r);
});

renderSide(right, 1);
renderSide(left, -1);


function renderSide(roleList, direction) {

  const spacingY = height / (roleList.length + 1);

  roleList.forEach((role, index) => {

    const roleY = spacingY * (index + 1);
    const roleX = rootX + (direction * horizontalSpacing);

    const clampedX = clamp(roleX);
    const roleLabel = rolesData[role]?.ten || mindmaps[role]?.name || role;

    createNode(roleLabel, clampedX, roleY, 1);
    drawLine(rootX, rootY, clampedX, roleY, 1);

    const children = mindmaps[role]?.children || [];

    renderChildren(children, clampedX, roleY, direction, 2);
  });
}


function renderChildren(children, parentX, parentY, direction, level) {

  if (!children || level > 5) return;

  const tempNodes = children.map(child => {
    const temp = createNode(child.text, -9999, -9999, level);
    return { child, element: temp, height: temp.offsetHeight, width: temp.offsetWidth };
  });

  const minNodeGap = 30;
  const verticalGap = Math.max(minNodeGap * 2, 80);

  let currentY = parentY - (tempNodes.length * verticalGap) / 2;

  tempNodes.forEach(({ child, element, height: nodeHeight, width: nodeWidth }) => {
    
    const levelMultiplier = 1 + (level - 2) * 0.2;
    const x = parentX + (direction * horizontalSpacing * levelMultiplier);
    const y = currentY + nodeHeight / 2;

    const clampedX = clamp(x);

    element.style.left = clampedX + "px";
    element.style.top = y + "px";

    drawLine(parentX, parentY, clampedX, y, level);

    currentY += nodeHeight + verticalGap;

    if (child.children && child.children.length > 0) {
      renderChildren(child.children, clampedX, y, direction, level + 1);
    }
  });
}

function createNode(text, x, y, level) {
  const node = document.createElement("div");
  node.className = "mindmap-node level-" + level;
  node.innerText = text;
  node.style.left = x + "px";
  node.style.top = y + "px";
  node.style.transform = "translate(-50%, -50%)";
  viewport.appendChild(node);
  return node;
}

function drawLine(x1, y1, x2, y2, level = 1) {

  const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

  let shortenStart, shortenEnd;
  if (level <= 2) {
    shortenStart = 25;
    shortenEnd = 35;
  } else {
    shortenStart = 15;
    shortenEnd = 20;
  }

  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.sqrt(dx * dx + dy * dy);
  if (!length) return;

  const unitX = dx / length;
  const unitY = dy / length;

  const newX1 = x1 + unitX * shortenStart;
  const newY1 = y1 + unitY * shortenStart;
  const newX2 = x2 - unitX * shortenEnd;
  const newY2 = y2 - unitY * shortenEnd;

  line.setAttribute("x1", newX1);
  line.setAttribute("y1", newY1);
  line.setAttribute("x2", newX2);
  line.setAttribute("y2", newY2);
  line.classList.add("mindmap-line");
  line.setAttribute("stroke-width", "1.4");
  line.setAttribute("stroke-linecap", "round");

  svg.appendChild(line);
}

function clamp(x) {
  return Math.max(80, Math.min(width - 80, x));
}

let scale = 1;
let isDragging = false;
let startX, startY;
let translateX = (container.clientWidth - width) / 2;
let translateY = (container.clientHeight - height) / 2;

updateTransform();

setTimeout(fitToView, 100);

function fitToView() {

  const nodes = viewport.querySelectorAll(".mindmap-node");
  if (nodes.length === 0) return;

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  
  nodes.forEach(node => {
    const rect = node.getBoundingClientRect();
    const x = parseFloat(node.style.left) || 0;
    const y = parseFloat(node.style.top) || 0;
    const w = node.offsetWidth || 120;
    const h = node.offsetHeight || 40;
    
    minX = Math.min(minX, x - w/2 - 50);
    minY = Math.min(minY, y - h/2 - 50);
    maxX = Math.max(maxX, x + w/2 + 50);
    maxY = Math.max(maxY, y + h/2 + 50);
  });

  const contentWidth = maxX - minX;
  const contentHeight = maxY - minY;
  
  if (contentWidth <= 0 || contentHeight <= 0) return;

  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  const padding = 60;
  const scaleX = (containerWidth - padding * 2) / contentWidth;
  const scaleY = (containerHeight - padding * 2) / contentHeight;
  
  scale = Math.min(scaleX, scaleY, 1);
  scale = Math.max(0.3, Math.min(1.2, scale));
  
  const centerX = (minX + maxX) / 2;
  const centerY = (minY + maxY) / 2;
  
  translateX = containerWidth / 2 - centerX * scale;
  translateY = containerHeight / 2 - centerY * scale;
  
  updateTransform();
}

function updateTransform() {
  viewport.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}


container.addEventListener("wheel", (e) => {
  e.preventDefault();

  const zoomSpeed = 0.1;

  if (e.deltaY < 0) scale += zoomSpeed;
  else scale -= zoomSpeed;

  scale = Math.min(Math.max(0.5, scale), 2.5);

  updateTransform();
});


let lastDistance = null;

container.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    // drag
    isDragging = true;
    startX = e.touches[0].clientX - translateX;
    startY = e.touches[0].clientY - translateY;
  }

  if (e.touches.length === 2) {

    lastDistance = getDistance(e.touches);
  }
});

container.addEventListener("touchmove", (e) => {
  e.preventDefault();

  if (e.touches.length === 1 && isDragging) {
    translateX = e.touches[0].clientX - startX;
    translateY = e.touches[0].clientY - startY;
    updateTransform();
  }

  if (e.touches.length === 2) {
    const newDistance = getDistance(e.touches);

    if (lastDistance) {
      const delta = newDistance - lastDistance;
      scale += delta * 0.005;
      scale = Math.min(Math.max(0.5, scale), 2.5);
      updateTransform();
    }

    lastDistance = newDistance;
  }
});

container.addEventListener("touchend", () => {
  isDragging = false;
  lastDistance = null;
});


function getDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

container.addEventListener("dblclick", () => {
  fitToView();
});
}

async function exportMindmapImage(event) {
  event.stopPropagation();

  const container = document.getElementById("finalMindmap");
  const exportBtn = container.querySelector(".export-btn");

  exportBtn.style.display = "none";

  container.classList.add("exporting");

  try {
    const canvas = await html2canvas(container, {
      backgroundColor: "#ffffff",
      scale: 2,
      useCORS: true,
      logging: false
    });

    const link = document.createElement("a");
    link.download = "critical-ai-mindmap.png";
    link.href = canvas.toDataURL("image/png");
    link.click();

  } catch (err) {
    showError("Không thể xuất ảnh.");
    console.error(err);
  }

  container.classList.remove("exporting");

  exportBtn.style.display = "block";
}

function goToCriteria() {
  window.location.href = "Introduction.html#criteria";
}

loadHistory();

</script>
